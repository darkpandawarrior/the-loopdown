name: loopdown-pipeline

# `archive/**` belongs in these filters even though no step reads it directly: build-registry.mjs
# scans archive/*.md, and the "Registry is up to date" step fails when data/registry.json or the
# README table drifts from it. Without the trigger, adding an archive piece cannot run the check
# that exists to catch exactly that — the staleness surfaces later, on an unrelated PR, looking
# like that PR's fault. This is how the README sat a row behind until 2026-08-14.
#
# `fiction/**` is here for exactly the same reason, and the same mistake was made again on
# 2026-08-15: build-registry.mjs now also scans fiction/morkinstar-journals for the anthology
# block, the trigger was not widened to match, and two commits landed with a stale registry that
# only failed once an unrelated push happened to touch scripts/**. The rule the paragraph above
# was written to teach applies to every directory the generator reads, not just the one that
# taught it.
#
# `.github/workflows/**` is here so a change to this file runs the pipeline it is changing.
on:
  push:
    branches: [main]
    paths: ["lessons/**", "archive/**", "fiction/**", "scripts/**", "templates/**", "lore/**", "profile.yaml", ".github/workflows/**"]
  pull_request:
    paths: ["lessons/**", "archive/**", "fiction/**", "scripts/**", "templates/**", "lore/**", "profile.yaml", ".github/workflows/**"]

# one run per ref; cancel superseded runs
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install deps
        working-directory: scripts
        run: npm ci

      # `npm ci` installs the playwright PACKAGE; it does not download the browser binaries, and
      # nothing else in this job does either. render.mjs drives headless Chromium to rasterise each
      # lesson's social card, so the smoke test died on "Executable doesn't exist at
      # ~/.cache/ms-playwright/..." — a missing runtime, never a bad card.
      #
      # chromium only (render.mjs and carousel.mjs use nothing else) and --with-deps for the system
      # libraries the headless shell needs on a bare ubuntu runner.
      - name: Install Playwright Chromium
        working-directory: scripts
        run: npx playwright install --with-deps chromium

      - name: Lint voice (no em dashes / AI tells)
        run: |
          fail=0
          for d in lessons/*/; do
            node scripts/lint-voice.mjs "$d" || fail=1
          done
          # fiction/** was never in this loop, so no published entry has ever
          # been linted for anything, including the residue-tag check lint-voice.mjs
          # just learned. Same gate as the lessons above, not a separate one:
          # this is the fix for s3-09 shipping `</content>` for weeks after its
          # source was already clean, and a second, softer gate would repeat it.
          node scripts/lint-voice.mjs fiction/morkinstar-journals || fail=1
          exit $fail

      - name: Graphics render smoke test
        run: |
          for d in lessons/*/; do
            [ -f "$d/assets/card.yaml" ] && node scripts/render.mjs "$d"
            [ -f "$d/assets/carousel.json" ] && node scripts/carousel.mjs "$d"
          done

      - name: Registry is up to date
        run: |
          node scripts/build-registry.mjs
          if ! git diff --quiet -- data/registry.json README.md series/; then
            echo "::error::registry/README/series are stale. Run 'node scripts/build-registry.mjs' and commit."
            git --no-pager diff --stat -- data/registry.json README.md series/
            exit 1
          fi
