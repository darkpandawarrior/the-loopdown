name: loopdown-pipeline

# `archive/**` belongs in these filters even though no step reads it directly: build-registry.mjs
# scans archive/*.md, and the "Registry is up to date" step fails when data/registry.json or the
# README table drifts from it. Without the trigger, adding an archive piece cannot run the check
# that exists to catch exactly that — the staleness surfaces later, on an unrelated PR, looking
# like that PR's fault. This is how the README sat a row behind until 2026-08-14.
on:
  push:
    branches: [main]
    paths: ["lessons/**", "archive/**", "scripts/**", "templates/**", "lore/**", "profile.yaml"]
  pull_request:
    paths: ["lessons/**", "archive/**", "scripts/**", "templates/**", "lore/**", "profile.yaml"]

# one run per ref; cancel superseded runs
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install deps
        working-directory: scripts
        run: npm ci

      # `npm ci` installs the playwright PACKAGE; it does not download the browser binaries, and
      # nothing else in this job does either. render.mjs drives headless Chromium to rasterise each
      # lesson's social card, so the smoke test died on "Executable doesn't exist at
      # ~/.cache/ms-playwright/..." — a missing runtime, never a bad card.
      #
      # chromium only (render.mjs and carousel.mjs use nothing else) and --with-deps for the system
      # libraries the headless shell needs on a bare ubuntu runner.
      - name: Install Playwright Chromium
        working-directory: scripts
        run: npx playwright install --with-deps chromium

      - name: Lint voice (no em dashes / AI tells)
        run: |
          fail=0
          for d in lessons/*/; do
            node scripts/lint-voice.mjs "$d" || fail=1
          done
          exit $fail

      - name: Graphics render smoke test
        run: |
          for d in lessons/*/; do
            [ -f "$d/assets/card.yaml" ] && node scripts/render.mjs "$d"
            [ -f "$d/assets/carousel.json" ] && node scripts/carousel.mjs "$d"
          done

      - name: Registry is up to date
        run: |
          node scripts/build-registry.mjs
          if ! git diff --quiet -- data/registry.json README.md series/; then
            echo "::error::registry/README/series are stale. Run 'node scripts/build-registry.mjs' and commit."
            git --no-pager diff --stat -- data/registry.json README.md series/
            exit 1
          fi
