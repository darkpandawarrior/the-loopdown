<svg width="1200" height="1200" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg">
  <!-- The Loopdown code-card. Placeholders:
       {{ACCENT}} {{PILLAR}} {{TITLE_1..2}} {{CODE_BLOCK}} {{TAKEAWAY_1..2}} {{HANDLE}}
       Design language matches scripts/carousel.mjs. Code colour comes from
       scripts/kotlin-highlight.mjs, injected as {{CODE_BLOCK}}. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#0F131A"/><stop offset="1" stop-color="#080A0E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.12" cy="0.06" r="0.75">
      <stop offset="0" stop-color="{{ACCENT}}" stop-opacity="0.20"/>
      <stop offset="1" stop-color="{{ACCENT}}" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="{{ACCENT}}"/><stop offset="1" stop-color="{{ACCENT}}" stop-opacity="0.2"/>
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#5A6675" fill-opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" fill="url(#dots)"/>
  <rect width="1200" height="1200" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="8" fill="url(#rail)"/>

  <!-- pillar tag -->
  <text x="72" y="150" fill="{{ACCENT}}" font-family="'SF Mono','JetBrains Mono',Menlo,monospace" font-size="30" letter-spacing="4">// {{PILLAR}}</text>

  <!-- title -->
  <text x="70" y="272" fill="#EDF2F7" font-size="68" font-weight="800" letter-spacing="-1.5" font-family="'SF Pro Display','Helvetica Neue','Inter',sans-serif">{{TITLE_1}}</text>
  <text x="70" y="356" fill="{{ACCENT}}" font-size="68" font-weight="800" letter-spacing="-1.5" font-family="'SF Pro Display','Helvetica Neue','Inter',sans-serif">{{TITLE_2}}</text>

  <!-- code panel -->
  <rect x="70" y="430" width="1060" height="450" rx="20" fill="#04060A" stroke="#1C2430" stroke-width="2"/>
  <circle cx="112" cy="470" r="9" fill="#FF5F56"/>
  <circle cx="144" cy="470" r="9" fill="#FFBD2E"/>
  <circle cx="176" cy="470" r="9" fill="#27C93F"/>
  {{CODE_BLOCK}}

  <!-- takeaway -->
  <rect x="70" y="944" width="86" height="5" rx="2.5" fill="{{ACCENT}}"/>
  <text x="70" y="1024" fill="#EDF2F7" font-size="40" font-weight="700" font-family="'SF Pro Display','Helvetica Neue','Inter',sans-serif">{{TAKEAWAY_1}}</text>
  <text x="70" y="1080" fill="{{ACCENT}}" font-size="40" font-weight="700" font-family="'SF Pro Display','Helvetica Neue','Inter',sans-serif">{{TAKEAWAY_2}}</text>

  <!-- footer -->
  <rect x="70" y="1122" width="1060" height="1.5" fill="#1C2430"/>
  <circle cx="82" cy="1166" r="11" fill="none" stroke="{{ACCENT}}" stroke-width="3"/>
  <circle cx="82" cy="1166" r="4" fill="{{ACCENT}}"/>
  <text x="108" y="1176" fill="#EDF2F7" font-family="'SF Mono','JetBrains Mono',Menlo,monospace" font-size="28" font-weight="600">The Loopdown</text>
  <text x="1130" y="1176" fill="#5A6675" font-family="'SF Mono','JetBrains Mono',Menlo,monospace" font-size="26" text-anchor="end">{{HANDLE}}</text>
</svg>
